<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Pipeline Apply Helper</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        color: #1b2033;
        background: #f6f3ee;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 6px;
        color: #1f2a54;
        font-size: 17px;
      }

      p {
        margin: 0 0 12px;
        color: #5e6578;
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 9px 12px;
        border: 1px solid #e4dfd6;
        border-radius: 7px;
        background: #fff;
        color: #1b2033;
        cursor: pointer;
        font: inherit;
      }

      button.primary {
        border-color: #1f2a54;
        background: #1f2a54;
        color: #fff;
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #status {
        min-height: 21px;
        margin-top: 12px;
        overflow-wrap: anywhere;
      }

      #kitFile {
        display: none;
      }

      .privacy {
        margin-top: 12px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Job Pipeline Apply Helper</h1>
    <p>Fill supported, empty fields on the current application page. Review everything before submitting.</p>
    <input id="kitFile" type="file" accept="application/json,.json">
    <button id="importKit">Import Apply Kit JSON</button>
    <button id="fillPage" class="primary" disabled>Fill this page</button>
    <button id="forgetKit" hidden>Forget saved Apply Kit</button>
    <div id="status" role="status" aria-live="polite"></div>
    <p class="privacy">Your Apply Kit stays in this browser's local extension storage. The helper does not submit forms or upload files; select your resume in the application form yourself.</p>
    <script src="fill.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
